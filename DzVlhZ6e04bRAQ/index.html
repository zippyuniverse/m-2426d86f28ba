*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#EFEAE1;color:#1A1A1A;font-family:'Do Hyeon','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{display:flex;gap:32px;align-items:flex-start;justify-content:center;padding:16px 24px}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.chrome{width:414px;display:flex;align-items:center;gap:8px}
.cbtn{height:40px;padding:0 14px;border-radius:20px;background:#FFFFFF;border:1px solid #C4C4C4;font-size:16px;display:flex;align-items:center;gap:4px}
.cbtn:disabled{opacity:.4;cursor:default}
.lbl{flex:1;min-width:0;font-size:16px;line-height:1.25}
.lbl small{display:block;font-size:13px;color:#525252;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ribbon{width:414px;height:36px;border-radius:10px;background:#FFE074;color:#1A1A1A;font-size:15px;padding:0 12px;display:flex;align-items:center;visibility:hidden;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ribbon.on{visibility:visible}
.phone{width:414px;height:868px;border-radius:44px;background:#1A1A1A;padding:12px;box-shadow:0 12px 40px rgba(26,26,26,.18)}
#screen{position:relative;width:390px;height:844px;border-radius:32px;overflow:hidden;background:#FAFAFA}
#vp{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#vp::-webkit-scrollbar{display:none}
#page{position:relative;width:390px}
#page img.shot{display:block;width:390px;user-select:none;-webkit-user-drag:none}
.bar{position:absolute;left:0;width:390px;background-repeat:no-repeat;background-size:390px auto;z-index:30}
.hs{position:absolute;z-index:2;border-radius:8px;-webkit-tap-highlight-color:transparent}
.hs.scrim{z-index:1;border-radius:0}
.hs.block{z-index:1;cursor:default}
body.outl .hs:not(.block){outline:2px solid rgba(240,80,90,.95);outline-offset:-2px;background:rgba(240,80,90,.10)}
body.outl .hs.longonly{outline-color:rgba(63,137,246,.95);outline-style:dashed;background:rgba(63,137,246,.10)}
body.outl .hs.haslong:not(.longonly){box-shadow:inset 0 0 0 4px rgba(63,137,246,.45)}
body.outl .hs.scrim{outline:3px dashed rgba(255,255,255,.9);background:rgba(240,80,90,.06)}
#toast{position:absolute;left:20px;right:20px;bottom:110px;background:#1A1A1A;color:#FFFFFF;border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.45;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
/* 준비 중인 화면 (v5 토큰) */
#cs{position:absolute;inset:0;background:#FAFAFA;display:none;flex-direction:column;z-index:40}
#cs.on{display:flex}
#cs .top{display:flex;align-items:center;height:56px;padding:0 12px 0 8px}
#cs .ib{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}
#cs main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px 120px;text-align:center}
#cs .ico{width:72px;height:72px;border-radius:36px;background:#EEEEEE;display:grid;place-items:center;margin-bottom:20px}
#cs h1{font-size:26px;font-weight:400}
#cs .help{margin-top:8px;font-size:14px;color:#525252}
#cs .card{margin-top:20px;background:#FFFFFF;border:1px solid #C4C4C4;border-radius:16px;padding:14px 18px;font-size:18px;line-height:1.4;max-width:320px}
#cs .bottom{padding:12px 20px 28px}
#cs .pri{width:100%;height:52px;border-radius:22px;background:#F0505A;color:#FFFFFF;font-size:20px}
/* 옆 패널 */
.side{width:340px;max-height:calc(100vh - 48px);overflow:auto;background:#FFFFFF;border:1px solid #C4C4C4;border-radius:16px;padding:16px}
.side h2{font-size:20px;font-weight:400}
.side .help{font-size:13px;color:#525252;line-height:1.45;margin-top:4px}
.tg{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:15px;cursor:pointer}
.tg input{width:18px;height:18px;accent-color:#F0505A}
.side h3{font-size:14px;font-weight:400;color:#525252;margin:14px 0 4px}
.side a{display:block;padding:5px 8px;border-radius:8px;color:#1A1A1A;text-decoration:none;font-size:15px;line-height:1.3}
.side a small{color:#7E7E7E;font-size:12px}
.side a:hover{background:#EEEEEE}
.side a.cur{background:#FDECEC}
.side a .o{display:inline-block;width:8px;height:8px;border-radius:4px;background:#F4C430;margin-left:4px;vertical-align:middle}
.side .links{display:flex;gap:8px;margin-top:10px}
.side .links a{display:inline-block;background:#EEEEEE}
</style></head>

const S={}; DATA.screens.forEach(s=>S[s.id]=s);
let stack=[], token=0;
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1600);}
function cur(){return stack[stack.length-1]}
function parse(to){ if(to.startsWith('cs:')) return {id:'coming-soon',cs:to.slice(3)};
  const [id,anc]=to.split('@'); return {id,anchor:anc}; }
function act(to,mode){
  if(!to) return;
  if(to==='back') return back();
  if(to.startsWith('ret:')){ // r9b: 시트 '저장' → 시트를 연 화면으로 (필요하면 그 화면의 다음 상태로)
    const [def,mp]=to.slice(4).split('|'); const M={}; (mp||'').split(',').filter(Boolean).forEach(p=>{const [a,b]=p.split('>');M[a]=b;});
    const c=cur(); if(c&&S[c.id]&&S[c.id].sheet&&stack.length>1){stack.pop(); const u=cur(); if(M[u.id]) stack[stack.length-1]={id:M[u.id]}; render(); return;}
    return act(def,mode);
  }
  if(to.startsWith('note:')) return toast(to.slice(5));
  const e=parse(to); if(e.id!=='coming-soon'&&!S[e.id]){toast('없는 화면: '+e.id);return;}
  const c=cur(); const fromSheet=c&&S[c.id]&&S[c.id].sheet;
  if(fromSheet){stack.pop(); const t=cur(); if(t&&t.id===e.id&&!e.cs){render(e.anchor);return;}}
  if(mode==='rep'&&stack.length) stack[stack.length-1]={id:e.id,cs:e.cs}; else stack.push({id:e.id,cs:e.cs});
  render(e.anchor);
}
function back(){ if(stack.length>1){stack.pop();render();} else toast('처음 화면이에요'); }
function hashOf(e){return e.id==='coming-soon'?'coming-soon'+(e.cs?':'+encodeURIComponent(e.cs):''):e.id}
function mk(h,layer,k){
  if(h.block){const d=document.createElement('div');d.className='hs block';pos(d,h);layer.appendChild(d);return;}
  const b=document.createElement('button'); b.className='hs'+(h.scrim?' scrim':'')+(h.long?' haslong':'')+(h.long&&!h.to?' longonly':'');
  pos(b,h); b.dataset.k=k; b.dataset.to=h.to||''; if(h.long) b.dataset.long=h.long; b.dataset.m=h.m||'push'; if(h.tab) b.dataset.tab='1';
  b.title=(h.lab||'')+(h.to?' → '+h.to:'')+(h.long?' · 길게 → '+h.long:''); b.setAttribute('aria-label',b.title);
  let timer=null, fired=false;
  const doLong=()=>{fired=true; act(h.long,h.m)};
  b.addEventListener('pointerdown',ev=>{ if(ev.button!==0||ev.shiftKey||!h.long) return; fired=false; timer=setTimeout(doLong,550);});
  const clr=()=>{clearTimeout(timer);timer=null}; b.addEventListener('pointerup',clr); b.addEventListener('pointerleave',clr);
  b.addEventListener('contextmenu',ev=>{ev.preventDefault(); if(h.long){clr(); doLong(); setTimeout(()=>fired=false,0);}});
  b.addEventListener('click',ev=>{ ev.stopPropagation(); if(fired){fired=false;return;}
    if(ev.shiftKey&&h.long) return doLong();
    if(!h.to&&h.long) return toast('길게 누르세요 (우클릭·Shift+클릭도 돼요)');
    act(h.to,h.m);});
  layer.appendChild(b);
}
function pos(el,h){el.style.left=h.x+'px';el.style.top=h.y+'px';el.style.width=h.w+'px';el.style.height=h.h+'px';}
function render(anchor){
  const e=cur(); token++; const my=token;
  history.replaceState(null,'','#'+hashOf(e));
  document.body.dataset.screen=e.id;
  $('backbtn').disabled=stack.length<2;
  document.querySelectorAll('#list a').forEach(a=>a.classList.toggle('cur',a.dataset.id===e.id));
  const page=$('page'), bars=$('bars'); page.innerHTML=''; bars.innerHTML='';
  if(e.id==='coming-soon'){ $('cs').classList.add('on'); $('csname').textContent=e.cs||'(이름 없음)';
    $('lbl').innerHTML='준비 중인 화면<small>coming-soon · '+esc(e.cs||'')+'</small>'; $('ribbon').classList.remove('on'); $('vp').scrollTop=0; return; }
  $('cs').classList.remove('on');
  const s=S[e.id];
  $('lbl').innerHTML=esc(s.name)+'<small>'+s.id+' · 기획서 '+esc(s.rows)+'행</small>';
  const r=$('ribbon'); if(s.ribbon){r.textContent=s.ribbon; r.classList.add('on');} else r.classList.remove('on');
  page.style.height=s.H+'px';
  const img=new Image(); img.className='shot'; img.src='screens/'+s.id+'.png'; img.alt=s.name; img.draggable=false; page.appendChild(img);
  const bl=s.bars.map(b=>{const d=document.createElement('div'); d.className='bar'; d.style.bottom='0'; d.style.height=b.h+'px';
     d.style.backgroundImage="url('screens/"+s.id+".png')"; d.style.backgroundPosition='0 -'+b.y+'px'; bars.appendChild(d); return d;});
  s.hs.forEach((h,k)=>mk(h, h.bar!=null?bl[h.bar]:page, k));
  const vp=$('vp'); vp.style.overflowY=s.H>844?'auto':'hidden'; vp.scrollTop=0;
  if(anchor&&s.anchors[anchor]!=null) vp.scrollTop=Math.max(0,s.anchors[anchor]-12);
  const au=DATA.auto[s.id]; if(au) setTimeout(()=>{ if(token===my){ act(au[0],'rep'); } },au[1]);
}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fromHash(push){
  let h=decodeURIComponent(location.hash.slice(1)); let e;
  if(h.startsWith('coming-soon')) e={id:'coming-soon',cs:h.split(':').slice(1).join(':')||'(이름 없음)'};
  else if(S[h]) e={id:h}; else if(h) e={id:'coming-soon',cs:'없는 화면 id: '+h}; else e={id:'signup'};
  const c=cur(); if(c&&c.id===e.id&&c.cs===e.cs) return;
  if(push&&stack.length) stack.push(e); else stack=[e];
  render();
}

(()=>{const L=$('list'); let g=null; DATA.screens.forEach(s=>{ if(s.grp!==g){g=s.grp; const h=document.createElement('h3'); h.textContent=g; L.appendChild(h);}
  const a=document.createElement('a'); a.href='#'+s.id; a.dataset.id=s.id; a.innerHTML=esc(s.name)+(s.ribbon?'<i class="o" title="'+esc(s.ribbon)+'"></i>':'')+'<br><small>'+s.id+'</small>'; L.appendChild(a);});
  const h=document.createElement('h3'); h.textContent='준비 중'; L.appendChild(h);
  const a=document.createElement('a'); a.href='#coming-soon'; a.dataset.id='coming-soon'; a.innerHTML='준비 중인 화면<br><small>coming-soon</small>'; L.appendChild(a);})();
$('backbtn').onclick=back; $('csback').onclick=back; $('csback2').onclick=back;
$('outl').onchange=ev=>document.body.classList.toggle('outl',ev.target.checked);
window.addEventListener('hashchange',()=>fromHash(true));
window.MOCK={reset:(ids)=>{stack=ids.map(id=>({id}));render();},cur:()=>cur().id, cs:()=>cur().cs, stack:()=>stack.map(e=>e.id), data:DATA, act, back};
